<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentctl</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1b1e24;
    --panel-2: #22262e;
    --line: #2e333d;
    --fg: #d7dce4;
    --dim: #8a93a3;
    --accent: #7aa2f7;
    --create: #79c07a;
    --update: #d7a55f;
    --delete: #e06c75;
    --cmd: #56b6c2;
    --warn: #d7a55f;
    --error: #e06c75;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f7; --panel: #ffffff; --panel-2: #f0f1f4; --line: #d8dbe1;
      --fg: #1e222a; --dim: #6b7280; --accent: #2f5fd0;
      --create: #217a3a; --update: #9a6512; --delete: #b3261e; --cmd: #0d6c78;
      --warn: #9a6512; --error: #b3261e;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }

  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 650; letter-spacing: .01em; }
  .path { font-family: var(--mono); color: var(--dim); font-size: 12px; }
  .spacer { flex: 1 1 auto; }
  .dim { color: var(--dim); font-size: 12px; }

  .toggles { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  label.chk { display: inline-flex; gap: 5px; align-items: center; color: var(--dim); cursor: pointer; user-select: none; }
  label.chk input { accent-color: var(--accent); margin: 0; }
  .tools { display: flex; gap: 4px; flex-wrap: wrap; }
  .tools button {
    font: inherit; font-size: 12px; padding: 2px 9px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--dim);
  }
  .tools button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

  button.primary {
    font: inherit; font-weight: 600; padding: 6px 16px; border-radius: 6px; cursor: pointer;
    border: 1px solid transparent; background: var(--delete); color: #fff;
  }
  button.primary:disabled { background: var(--panel-2); color: var(--dim); border-color: var(--line); cursor: default; }
  button.ghost {
    font: inherit; padding: 6px 12px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--fg);
  }

  main { flex: 1 1 auto; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }

  section { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  section + section { border-left: 1px solid var(--line); }
  @media (max-width: 900px) { section + section { border-left: 0; border-top: 1px solid var(--line); } }

  .head {
    display: flex; align-items: center; gap: 10px; padding: 6px 12px;
    background: var(--panel-2); border-bottom: 1px solid var(--line);
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim);
  }
  .head .status { text-transform: none; letter-spacing: 0; margin-left: auto; font-size: 12px; }
  .dirty { color: var(--update); }
  .busy { color: var(--accent); }
  .bad { color: var(--error); }

  .editor { position: relative; flex: 1 1 auto; display: flex; min-height: 0; background: var(--panel); }
  .gutter {
    padding: 10px 8px 10px 12px; text-align: right; color: var(--dim); opacity: .5;
    font: 12px/1.55 var(--mono); user-select: none; overflow: hidden; white-space: pre;
    border-right: 1px solid var(--line); background: var(--panel);
  }
  textarea {
    flex: 1 1 auto; resize: none; border: 0; outline: 0; padding: 10px 12px;
    background: transparent; color: var(--fg); font: 12px/1.55 var(--mono);
    tab-size: 2; white-space: pre; overflow: auto;
  }

  .out { flex: 1 1 auto; overflow: auto; background: var(--panel); }
  .findings { padding: 8px 12px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 12px; }
  .findings div { padding: 1px 0; }
  .f-error { color: var(--error); }
  .f-warn { color: var(--warn); }
  .f-note { color: var(--dim); }
  pre.plan { margin: 0; padding: 10px 12px; font: 12px/1.55 var(--mono); white-space: pre; }
  pre.plan .c { color: var(--create); }
  pre.plan .u { color: var(--update); }
  pre.plan .d { color: var(--delete); }
  pre.plan .n { color: var(--dim); }
  pre.plan .x { color: var(--cmd); }
  pre.plan .t { color: var(--fg); font-weight: 700; letter-spacing: .06em; }
  .stale { opacity: .45; }


  /* ---- left pane: tabs + controls ------------------------------------- */
  .tabs { display: flex; gap: 2px; }
  .tabs button {
    font: inherit; font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    padding: 2px 10px; border-radius: 5px; cursor: pointer;
    border: 1px solid transparent; background: transparent; color: var(--dim);
  }
  .tabs button[aria-selected="true"] { border-color: var(--line); background: var(--panel); color: var(--fg); }

  .setup { flex: 1 1 auto; overflow: auto; background: var(--panel); padding: 4px 0 24px; }
  .setup[hidden], .editor[hidden] { display: none; }
  .setup.disabled { opacity: .4; pointer-events: none; }

  details.sec { border-bottom: 1px solid var(--line); }
  details.sec > summary {
    cursor: pointer; padding: 7px 12px; list-style: none; display: flex; gap: 8px; align-items: baseline;
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim);
  }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary::before { content: "▸"; font-size: 9px; color: var(--dim); }
  details.sec[open] > summary::before { content: "▾"; }
  details.sec > summary .count { color: var(--accent); letter-spacing: 0; }
  .secdoc { padding: 0 12px 6px 26px; color: var(--dim); font-size: 12px; }

  .entry { margin: 2px 10px 8px 22px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel-2); }
  .entry.undeclared { border-style: dashed; background: transparent; }
  .entry > .ehead {
    display: flex; gap: 8px; align-items: center; padding: 5px 8px 5px 10px;
    border-bottom: 1px solid var(--line);
  }
  .entry.undeclared > .ehead { border-bottom: 0; }
  .entry .name { font-family: var(--mono); font-size: 12px; color: var(--fg); }
  .entry .rows { padding: 6px 8px 8px; display: flex; flex-direction: column; gap: 4px; }

  .row { display: flex; gap: 8px; align-items: flex-start; }
  .row .lbl {
    flex: 0 0 132px; text-align: right; padding-top: 4px; color: var(--dim);
    font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere;
  }
  .row .val { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .row .hint { color: var(--dim); font-size: 11px; }
  .row input[type=text], .row select, .row textarea {
    width: 100%; font: 12px var(--mono); padding: 3px 6px; border-radius: 5px;
    border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  }
  .row textarea { resize: vertical; min-height: 26px; }
  .row input[type=text]:focus, .row select:focus, .row textarea:focus { outline: 1px solid var(--accent); }
  .row input[type=checkbox] { accent-color: var(--accent); margin: 5px 0 0; }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .chips button {
    font: 11px var(--mono); padding: 2px 8px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--dim);
  }
  .chips button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .icon {
    font: inherit; line-height: 1; padding: 2px 6px; border-radius: 5px; cursor: pointer;
    border: 1px solid transparent; background: transparent; color: var(--dim);
  }
  .icon:hover { border-color: var(--line); color: var(--delete); }
  .add { display: flex; gap: 6px; align-items: center; margin: 0 10px 10px 22px; }
  .add input, .add select {
    font: 12px var(--mono); padding: 3px 6px; border-radius: 5px;
    border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  }
  .add button {
    font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 5px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--fg);
  }
  .formerr { padding: 10px 14px; color: var(--warn); font-size: 12px; }
  .rowerr { color: var(--warn); font-size: 11px; padding: 2px 0 0 10px; }

  table.tbl { width: calc(100% - 32px); margin: 0 10px 8px 22px; border-collapse: collapse; }
  table.tbl th {
    text-align: left; font: 11px var(--mono); font-weight: 400; color: var(--dim);
    padding: 0 6px 3px; border-bottom: 1px solid var(--line);
  }
  table.tbl td { padding: 2px 6px; vertical-align: top; }
  table.tbl td:last-child { width: 1%; }
  table.tbl input[type=text], table.tbl textarea {
    width: 100%; font: 12px var(--mono); padding: 3px 6px; border-radius: 5px;
    border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  }
  table.tbl input:focus, table.tbl textarea:focus { outline: 1px solid var(--accent); }
  table.tbl input.bad { border-color: var(--warn); }

  .tri { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
  .tri button {
    font: 11px var(--mono); padding: 1px 7px; cursor: pointer; border: 0;
    background: var(--panel); color: var(--dim);
  }
  .tri button[aria-pressed="true"] { background: var(--accent); color: var(--panel); }
  .flags { display: flex; flex-direction: column; gap: 3px; }
  .flag { display: flex; gap: 8px; align-items: center; }
  .flag .fname { font: 12px var(--mono); color: var(--fg); }

  .grp { margin: 2px 10px 8px 22px; }
  .grp .ghead { font: 12px var(--mono); color: var(--dim); padding: 0 0 3px 2px; }
  .grp .chips button[disabled] { opacity: .45; cursor: not-allowed; }

  footer {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 8px 14px; background: var(--panel); border-top: 1px solid var(--line);
  }
  .summary { font-family: var(--mono); font-size: 12px; color: var(--dim); }
  .note { font-size: 12px; color: var(--dim); }

  dialog {
    border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--fg);
    padding: 0; max-width: 560px; width: calc(100% - 32px);
  }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog .body { padding: 18px 20px 8px; }
  dialog h2 { margin: 0 0 8px; font-size: 15px; }
  dialog p { margin: 6px 0; color: var(--dim); }
  dialog .risk { color: var(--delete); font-weight: 600; }
  dialog .files { font-family: var(--mono); font-size: 12px; color: var(--fg); }
  dialog .actions { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px 18px; }
  kbd {
    font: 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 4px; padding: 0 4px; color: var(--dim);
  }
</style>
</head>
<body>
<header>
  <span class="brand">agentctl</span>
  <span class="path" id="path">__CONFIG_PATH__</span>
  <span class="spacer"></span>
  <span class="toggles" title="restrict the plan to these tools; none picked means the config decides">
    <span class="dim">plan filter</span>
    <span class="tools" id="tools"></span>
  </span>
  <span class="toggles">
    <label class="chk"><input type="checkbox" id="verbose"> verbose</label>
    <label class="chk"><input type="checkbox" id="shownoop"> show noop</label>
  </span>
</header>

<main>
  <section>
    <div class="head">
      <span class="tabs" id="tabs">
        <button type="button" data-view="setup" aria-selected="true">setup</button>
        <button type="button" data-view="text" aria-selected="false">agents.edn</button>
      </span>
      <span class="status" id="editstatus"></span>
    </div>
    <div class="setup" id="setup"></div>
    <div class="editor" id="texted" hidden>
      <div class="gutter" id="gutter">1</div>
      <textarea id="src" spellcheck="false" autocomplete="off"></textarea>
    </div>
  </section>

  <section>
    <div class="head">
      dry run
      <span class="status" id="planstatus"></span>
    </div>
    <div class="out">
      <div class="findings" id="findings" hidden></div>
      <pre class="plan" id="plan"></pre>
    </div>
  </section>
</main>

<footer>
  <button class="primary" id="apply" disabled>Apply</button>
  <span class="summary" id="summary"></span>
  <span class="spacer"></span>
  <span class="note" id="note"></span>
  <button class="ghost" id="reload" title="discard edits and re-read the file">Reload file</button>
  <span class="note"><kbd>⌘S</kbd> re-plan now</span>
</footer>

<dialog id="confirmdlg">
  <div class="body">
    <h2>Apply these changes?</h2>
    <p id="c-summary"></p>
    <p class="risk" id="c-secrets" hidden></p>
    <p>This writes the buffer to <span class="files" id="c-path"></span> and converges every tool
       config the plan touches. Replaced files are backed up first.</p>
  </div>
  <div class="actions">
    <button class="ghost" id="c-cancel">Cancel</button>
    <button class="primary" id="c-ok">Apply</button>
  </div>
</dialog>

<script>
const TOKEN = "__TOKEN__";
const $ = (id) => document.getElementById(id);
const src = $("src"), gutter = $("gutter"), planEl = $("plan"), findingsEl = $("findings");

let saved = "";            // what the file held when we last read or wrote it
let allTools = [];
let picked = new Set();    // empty = every tool the config activates
let last = null;           // last successful plan payload
let inflight = 0;
let timer = null;

const api = async (path, body) => {
  const res = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: {"X-Agentctl-Token": TOKEN, "content-type": "application/json"},
    body: body ? JSON.stringify(body) : undefined,
  });
  return {status: res.status, data: await res.json()};
};

const opts = () => ({
  text: src.value,
  tools: [...picked],
  verbose: $("verbose").checked,
  "show-noop": $("shownoop").checked,
});

/* ---- editor chrome ---------------------------------------------------- */

function syncGutter() {
  const n = src.value.split("\n").length;
  const want = Array.from({length: n}, (_, i) => i + 1).join("\n");
  if (gutter.textContent !== want) gutter.textContent = want;
  gutter.scrollTop = src.scrollTop;
}

function markDirty() {
  const el = $("editstatus");
  if (src.value !== saved) { el.textContent = "unsaved edits"; el.className = "status dirty"; }
  else { el.textContent = ""; el.className = "status"; }
}

src.addEventListener("scroll", () => { gutter.scrollTop = src.scrollTop; });
src.addEventListener("input", () => { syncGutter(); markDirty(); schedule(); });
src.addEventListener("keydown", (e) => {
  if (e.key === "Tab") {                       // indent, never leave the field
    e.preventDefault();
    const s = src.selectionStart, t = src.selectionEnd;
    src.setRangeText("  ", s, t, "end");
    src.dispatchEvent(new Event("input"));
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") { e.preventDefault(); refresh(); }
});

/* ---- plan rendering --------------------------------------------------- */

const esc = (s) => s.replace(/[&<>]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));

function renderPlan(text) {
  planEl.innerHTML = text.split("\n").map((line) => {
    const c = line.trim()[0];
    const cls = c === "+" ? "c" : c === "~" ? "u" : c === "-" ? "d"
              : c === "=" ? "n" : c === "!" ? "x"
              : /^[A-Z][A-Z ]*$/.test(line.trim()) ? "t" : "";
    return cls ? `<span class="${cls}">${esc(line)}</span>` : esc(line);
  }).join("\n");
}

function renderFindings(items, extra) {
  const rows = (items || []).map((f) =>
    `<div class="f-${f.level === "error" ? "error" : "warn"}">${
      f.level === "error" ? "✗" : "⚠"} ${esc(f.where)} — ${esc(f.message)}</div>`);
  for (const line of extra || []) rows.push(`<div class="f-note">${esc(line)}</div>`);
  findingsEl.innerHTML = rows.join("");
  findingsEl.hidden = rows.length === 0;
}

function show(p) {
  if (p.form) updateForm(p.form);
  const extra = [];
  if (p.missing && p.missing.length) extra.push("skipped (CLI not installed): " + p.missing.join(", "));
  renderFindings(p.findings, extra);
  planEl.classList.remove("stale");

  if (p.ok) {
    last = p;
    renderPlan(p.plan);
    $("summary").textContent = p.summary;
    $("apply").disabled = p.changes === 0;
    $("apply").textContent = p.changes ? `Apply ${p.changes} change${p.changes === 1 ? "" : "s"}` : "Apply";
    $("planstatus").textContent = "";
    $("planstatus").className = "status";
  } else {
    $("planstatus").textContent = p.error || "invalid config";
    $("planstatus").className = "status bad";
    $("apply").disabled = true;
    // the last good plan stays on screen, dimmed: blanking it on every
    // half-typed keystroke would leave nothing to read while editing
    planEl.classList.add("stale");
  }
}


/* ---- controls --------------------------------------------------------- */
/* The left pane is a form over the same buffer the text tab shows: every
   widget sends one op to /api/edit, which answers with the rewritten text and
   the plan for it. Nothing is written to disk until Apply. */

const setupEl = $("setup");
let formModel = null;
let pendingForm = null;               // a form that arrived while a field had focus
const revealed = new Set();           // fields asked for but not yet declared
const opened = new Set(), closed = new Set();
let editQueue = [], editing = false;
const debounce = new Map();

const attr = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const pkey = (path) => path.join(" ");
const idOf = (kind, name) => (kind === "symbol" ? name : ":" + name.replace(/^:/, ""));

/* ---- rendering -------------------------------------------------------- */

function widget(f) {
  const path = attr(JSON.stringify(f.path)), t = f.type;
  const v = f.value;
  if (t === "bool") {
    return `<input type="checkbox" data-path='${path}' data-type="bool"${v ? " checked" : ""}>`;
  }
  if (t === "str-enum") {
    const opts = (f.options || []).map((o) =>
      `<option value="${attr(o)}"${o === v ? " selected" : ""}>${esc(o)}</option>`).join("");
    return `<select data-path='${path}' data-type="str-enum"><option value="">--</option>${opts}` +
           `<option value="__other">other...</option></select>`;
  }
  if (t === "flags") {
    const off = attr(JSON.stringify(f["off-path"]));
    const rows = (f.options || []).map((o) => {
      const btn = (st, lbl) =>
        `<button type="button" data-state="${st}" aria-pressed="${o.state === st}">${lbl}</button>`;
      return `<div class="flag" data-flag="${attr(o.key)}" data-state="${attr(o.state)}">` +
             `<span class="tri">${btn("", "-")}${btn("on", "on")}${btn("off", "off")}</span>` +
             `<span class="fname">${esc(o.key)}</span></div>`;
    }).join("");
    return `<div class="flags" data-path='${path}' data-off-path='${off}' data-type="flags">${rows}</div>`;
  }
  if (t === "enum") {
    const opts = (f.options || []).map((o) =>
      `<option value="${attr(o)}"${o === v ? " selected" : ""}>${esc(o)}</option>`).join("");
    return `<select data-path='${path}' data-type="enum"><option value="">--</option>${opts}</select>`;
  }
  if (t === "kw-set" || t === "id-set") {
    const on = new Set(v || []);
    const chips = (f.options || []).map((o) =>
      `<button type="button" data-opt="${attr(o)}" aria-pressed="${on.has(o)}">${esc(o.replace(/^:/, ""))}</button>`).join("");
    return `<div class="chips" data-path='${path}' data-type="${t}">${chips || '<span class="hint">nothing declared yet</span>'}</div>`;
  }
  if (t === "edn") {
    return `<textarea data-path='${path}' data-type="edn" rows="1" spellcheck="false">${esc(v == null ? "" : v)}</textarea>`;
  }
  const list = f.suggest ? ` list="sug-${attr(f.key)}"` : "";
  const dl = f.suggest
    ? `<datalist id="sug-${attr(f.key)}">${f.suggest.map((x) => `<option value="${attr(x)}">`).join("")}</datalist>`
    : "";
  return `<input type="text" data-path='${path}' data-type="scalar" value="${attr(v == null ? "" : v)}"${list}>${dl}`;
}

function rowHtml(f) {
  const hint = f.hint && !f.present ? `<span class="hint">${esc(f.hint)}</span>` : "";
  const clear = f.present
    ? `<button type="button" class="icon" data-clear='${attr(JSON.stringify(f.path))}' title="remove this key">x</button>`
    : "";
  return `<div class="row"><span class="lbl">${esc(f.key)}</span>` +
         `<span class="val">${widget(f)}${hint}</span>${clear}</div>`;
}

function entryHtml(sec, e) {
  const del = `<button type="button" class="icon" data-del='${attr(JSON.stringify(e.path))}' title="remove">x</button>`;
  if (!e.declared) {
    return `<div class="entry undeclared"><div class="ehead"><span class="name">${esc(e.label)}</span>` +
           `<span class="spacer"></span>` +
           `<button type="button" class="icon" data-add='${attr(JSON.stringify(e.path))}' ` +
           `data-template="${attr(sec.template || "{}")}" title="configure">+ configure</button></div></div>`;
  }
  const fields = e.fields.concat(e.extra || []);
  const vis = (f) => f.present || f.always || revealed.has(pkey(f.path));
  const shown = fields.filter(vis);
  const hidden = fields.filter((f) => !vis(f));
  const more = hidden.length
    ? `<div class="row"><span class="lbl"></span><span class="val">` +
      `<select class="addfield"><option value="">+ field</option>` +
      hidden.map((f) => `<option value="${attr(pkey(f.path))}">${esc(f.key)}</option>`).join("") +
      `</select></span></div>`
    : "";
  return `<div class="entry" data-path='${attr(JSON.stringify(e.path))}'` +
         (e.shorthand ? ` data-shorthand="${attr(e.shorthand)}"` : "") + `>` +
         `<div class="ehead"><span class="name">${esc(e.label)}</span><span class="spacer"></span>${del}</div>` +
         `<div class="rows">${shown.map(rowHtml).join("")}${more}</div></div>`;
}

function tableHtml(sec) {
  // a binding is a name and a value, and both are editable: renaming one in
  // place keeps its position, its comment and the line it sits on, which
  // removing and re-adding it would not
  const kind = sec["id-kind"];
  const rows = sec.entries.map((e) => {
    const f = e.fields[0];
    return `<tr data-path='${attr(JSON.stringify(e.path))}'>` +
      `<td><input type="text" class="bname" data-kind="${attr(kind)}" ` +
      `data-was="${attr(e.label)}" value="${attr(e.label)}"></td>` +
      `<td>${widget(f)}</td>` +
      `<td><button type="button" class="icon" data-del='${attr(JSON.stringify(e.path))}' ` +
      `title="remove">x</button></td></tr>`;
  }).join("");
  const add = `<tr class="newrow"><td><input type="text" class="newid" ` +
    `data-section="${attr(sec.key)}" data-kind="${attr(kind)}" placeholder="name"></td>` +
    `<td><input type="text" class="newval" placeholder="value"></td>` +
    `<td><button type="button" class="addrow">add</button></td></tr>`;
  return `<table class="tbl"><thead><tr><th>name</th><th>value</th><th></th></tr></thead>` +
         `<tbody>${rows}${add}</tbody></table><div class="rowerr" hidden></div>`;
}

function groupHtml(g) {
  const chips = (g.options || []).map((o) =>
    `<button type="button" data-path='${attr(JSON.stringify(o.path))}' data-edn="${attr(o.edn)}" ` +
    `aria-pressed="${!!o.on}"${o.elsewhere ? ' disabled title="installed from another pack"' : ""}>` +
    `${esc(o.label)}</button>`).join("");
  return `<div class="grp"><div class="ghead">${esc(g.label)}</div>` +
         (g.note ? `<div class="secdoc">${esc(g.note)}</div>` : "") +
         (chips ? `<div class="chips grpchips">${chips}</div>` : "") + `</div>`;
}

function sectionHtml(sec) {
  const declared = sec.entries.filter((e) => e.declared);
  const isOpen = closed.has(sec.key) ? false : (opened.has(sec.key) || declared.length > 0);
  const add = sec["id-kind"] === "fixed" ? "" :
    `<div class="add"><input type="text" class="newid" placeholder="new ${esc(sec.entry)} name" ` +
    `data-section="${attr(sec.key)}" data-kind="${attr(sec["id-kind"])}" data-template="${attr(sec.template || "{}")}">` +
    `<button type="button" class="addentry">add</button></div>`;
  return `<details class="sec" data-key="${attr(sec.key)}"${isOpen ? " open" : ""}>` +
         `<summary>${esc(sec.title)}<span class="count">${declared.length || ""}</span></summary>` +
         (sec.doc ? `<div class="secdoc">${esc(sec.doc)}</div>` : "") +
         (sec.layout === "table"
           ? tableHtml(sec)
           : (sec.groups || []).map(groupHtml).join("") +
             sec.entries.map((e) => entryHtml(sec, e)).join("") + add) +
         `</details>`;
}

function renderSetup(form) {
  formModel = form;
  pendingForm = null;
  if (!form || !form.ok) {
    setupEl.innerHTML = `<div class="formerr">${esc((form && form.error) || "the buffer does not parse - fix it in the agents.edn tab")}</div>`;
    return;
  }
  const unknown = (form.unknown || []).length
    ? `<details class="sec" open><summary>Not read by agentctl<span class="count">${form.unknown.length}</span></summary>` +
      `<div class="entry"><div class="rows">${form.unknown.map(rowHtml).join("")}</div></div></details>`
    : "";
  setupEl.innerHTML = form.sections.map(sectionHtml).join("") + unknown;
  for (const ta of setupEl.querySelectorAll("textarea")) grow(ta);
}

function grow(ta) { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 180) + "px"; }

function updateForm(form) {
  // never re-render under a field being typed into: it would eat the caret and
  // the last keystrokes with it
  if (setupEl.contains(document.activeElement)) pendingForm = form;
  else renderSetup(form);
}

/* ---- sending edits ---------------------------------------------------- */

async function sendOps(ops) {
  if (!ops.length) return;
  editQueue.push(...ops);
  if (editing) return;                 // one edit in flight: each carries the whole buffer
  editing = true;
  $("apply").disabled = true;          // apply sends the buffer; it must be the settled one
  try {
    while (editQueue.length) {
      const batch = editQueue.splice(0);
      const {status, data} = await api("/api/edit", {...opts(), ops: batch});
      if (status !== 200) {
        $("planstatus").textContent = data.error || "edit failed";
        $("planstatus").className = "status bad";
        continue;
      }
      src.value = data.text;
      syncGutter(); markDirty();
      show(data);
    }
  } finally { editing = false; }
}

function expandOps(el) {
  // a server declared as a bare command line has to become the map it is
  // shorthand for before a field inside it can be set. The op is idempotent
  // server-side: this copy of the form keeps sending it until a re-render, and
  // a repeat must not overwrite the field edits already made
  const entry = el.closest(".entry");
  const sh = entry && entry.dataset.shorthand;
  return sh ? [{op: "expand", path: JSON.parse(entry.dataset.path), edn: sh}] : [];
}

function flagOps(el) {
  // moving a flag from on to off rewrites two nodes; both keys travel together
  const on = [], off = [];
  for (const g of el.querySelectorAll("[data-flag]")) {
    if (g.dataset.state === "on") on.push(g.dataset.flag);
    else if (g.dataset.state === "off") off.push(g.dataset.flag);
  }
  const p = JSON.parse(el.dataset.path), q = JSON.parse(el.dataset["offPath"]);
  return [on.length ? {op: "set", path: p, type: "flag-set", value: on} : {op: "unset", path: p},
          off.length ? {op: "set", path: q, type: "flag-set", value: off} : {op: "unset", path: q}];
}

function fieldOp(el) {
  const path = JSON.parse(el.dataset.path), type = el.dataset.type;
  if (type === "bool") return {op: "set", path, type, value: el.checked};
  if (type === "kw-set" || type === "id-set") {
    const on = [...el.querySelectorAll('button[aria-pressed="true"]')].map((b) => b.dataset.opt);
    return on.length ? {op: "set", path, type, value: on} : {op: "unset", path};
  }
  if (el.value.trim() === "") return {op: "unset", path};
  return {op: "set", path, type, value: el.value};
}

function push(el) {
  if (el.dataset.type === "flags") { sendOps([...expandOps(el), ...flagOps(el)]); return; }
  sendOps([...expandOps(el), fieldOp(el)]);
}

const nameOk = (n) => /^[A-Za-z0-9][A-Za-z0-9._\/-]*$/.test(n);

function rowError(el, msg) {
  const box = el.closest("details.sec").querySelector(".rowerr");
  if (!box) return;
  box.textContent = msg || "";
  box.hidden = !msg;
}

setupEl.addEventListener("input", (e) => {
  const el = e.target;
  if (!el.dataset.path) return;
  if (el.tagName === "TEXTAREA") grow(el);
  if (el.type === "checkbox") return;
  const k = pkey(JSON.parse(el.dataset.path));
  clearTimeout(debounce.get(k));
  debounce.set(k, setTimeout(() => push(el), 400));
});

setupEl.addEventListener("change", (e) => {
  const el = e.target;
  if (el.classList.contains("bname")) {
    // an empty or malformed name is refused here and again on the server: the
    // buffer must never be rewritten into something the form cannot read back
    const name = el.value.trim(), was = el.dataset.was;
    if (name === was) { el.classList.remove("bad"); rowError(el, ""); return; }
    if (!nameOk(name)) {
      el.classList.add("bad");
      rowError(el, name ? `"${name}" is not a usable name` : "a binding needs a name");
      el.value = was; el.focus();
      return;
    }
    el.classList.remove("bad"); rowError(el, "");
    sendOps([{op: "rename", path: JSON.parse(el.closest("tr").dataset.path),
              value: idOf(el.dataset.kind, name)}]);
    return;
  }
  if (el.type === "text" && el.classList.contains("newid")) return;
  if (el.dataset.type === "str-enum" && el.value === "__other") {
    // the tool's schema lists a set and also allows values outside it; typing
    // one has to stay possible without leaving the form
    const box = document.createElement("input");
    box.type = "text";
    box.dataset.path = el.dataset.path;
    box.dataset.type = "str-enum";
    el.replaceWith(box);
    box.focus();
    return;
  }
  if (el.classList.contains("addfield")) {
    // a form that arrived while this select had focus is the newer one
    if (el.value) { revealed.add(el.value); renderSetup(pendingForm || formModel); }
    return;
  }
  if (!el.dataset.path) return;
  if (el.type === "checkbox" || el.tagName === "SELECT") push(el);
});

setupEl.addEventListener("click", (e) => {
  const tri = e.target.closest(".tri button");
  if (tri) {
    const flag = tri.closest("[data-flag]");
    flag.dataset.state = tri.dataset.state;
    for (const b of flag.querySelectorAll(".tri button")) {
      b.setAttribute("aria-pressed", String(b === tri));
    }
    push(flag.closest(".flags"));
    return;
  }
  const skill = e.target.closest(".grpchips button");
  if (skill) {
    const on = skill.getAttribute("aria-pressed") !== "true";
    skill.setAttribute("aria-pressed", String(on));
    const path = JSON.parse(skill.dataset.path);
    sendOps([on ? {op: "set", path, edn: skill.dataset.edn} : {op: "unset", path}]);
    return;
  }
  const addrow = e.target.closest(".addrow");
  if (addrow) {
    const tr = addrow.closest("tr");
    const id = tr.querySelector(".newid"), val = tr.querySelector(".newval");
    const name = id.value.trim();
    if (!nameOk(name)) {
      id.classList.add("bad");
      rowError(id, name ? `"${name}" is not a usable name` : "a binding needs a name");
      id.focus();
      return;
    }
    id.classList.remove("bad"); rowError(id, "");
    const path = [id.dataset.section, idOf(id.dataset.kind, name)];
    const v = val.value.trim();
    id.value = ""; val.value = "";
    // a binding with no value yet is an empty string, not a removed key
    sendOps([v === "" ? {op: "set", path, edn: '""'} : {op: "set", path, type: "scalar", value: v}]);
    return;
  }
  const chip = e.target.closest(".chips button");
  if (chip) {
    chip.setAttribute("aria-pressed", chip.getAttribute("aria-pressed") !== "true");
    push(chip.closest(".chips"));
    return;
  }
  const clear = e.target.closest("[data-clear]");
  if (clear) { sendOps([{op: "unset", path: JSON.parse(clear.dataset.clear)}]); return; }
  const del = e.target.closest("[data-del]");
  if (del) { sendOps([{op: "unset", path: JSON.parse(del.dataset.del)}]); return; }
  const add = e.target.closest("[data-add]");
  if (add) { sendOps([{op: "set", path: JSON.parse(add.dataset.add), edn: add.dataset.template}]); return; }
  const addentry = e.target.closest(".addentry");
  if (addentry) {
    const input = addentry.previousElementSibling;
    const name = input.value.trim();
    if (!/^[A-Za-z0-9][A-Za-z0-9._\/-]*$/.test(name)) { input.focus(); return; }
    input.value = "";
    opened.add(input.dataset.section);
    sendOps([{op: "set", path: [input.dataset.section, idOf(input.dataset.kind, name)],
              edn: input.dataset.template}]);
  }
});

setupEl.addEventListener("focusout", () => {
  setTimeout(() => {
    if (pendingForm && !setupEl.contains(document.activeElement)) renderSetup(pendingForm);
  }, 0);
});

setupEl.addEventListener("toggle", (e) => {
  const d = e.target.closest("details.sec");
  if (!d || !d.dataset.key) return;
  (d.open ? opened : closed).add(d.dataset.key);
  (d.open ? closed : opened).delete(d.dataset.key);
}, true);

$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const setup = b.dataset.view === "setup";
  for (const x of $("tabs").children) x.setAttribute("aria-selected", String(x === b));
  $("setup").hidden = !setup;
  $("texted").hidden = setup;
  if (setup && pendingForm) renderSetup(pendingForm);
  if (!setup) src.focus();
});

/* ---- plan / apply ----------------------------------------------------- */

async function refresh() {
  const seq = ++inflight;
  $("planstatus").textContent = "planning…";
  $("planstatus").className = "status busy";
  try {
    const {data} = await api("/api/plan", opts());
    if (seq === inflight) show(data);
  } catch (e) {
    if (seq === inflight) {
      $("planstatus").textContent = String(e);
      $("planstatus").className = "status bad";
    }
  }
}

function schedule() { clearTimeout(timer); timer = setTimeout(refresh, 350); }

const settled = async () => {
  while (editing || editQueue.length) await new Promise((r) => setTimeout(r, 30));
};

$("apply").addEventListener("click", () => {
  if (editing || !last || !last.ok || !last.changes) return;
  $("c-summary").textContent = last.summary;
  $("c-path").textContent = $("path").textContent;
  const sec = $("c-secrets");
  sec.hidden = !last.secrets;
  sec.textContent = last.secrets
    ? `${last.secrets} change(s) write resolved secrets into tool config files.` : "";
  $("confirmdlg").showModal();
});

$("c-cancel").addEventListener("click", () => $("confirmdlg").close());

$("c-ok").addEventListener("click", async () => {
  $("confirmdlg").close();
  $("apply").disabled = true;
  // an edit in flight means src.value is one response behind; applying it
  // would converge, and save, the older text
  await settled();
  if (!last || !last.ok || !last.changes) return;
  $("planstatus").textContent = "applying…";
  $("planstatus").className = "status busy";
  const {status, data} = await api("/api/apply", {...opts(), confirm: true, expect: last.summary});

  if (status === 409) {                       // the plan moved between render and click
    show(data);
    $("note").textContent = data.error;
    return;
  }
  if (!data.ok) {
    show(data);
    $("note").textContent = data.error || "apply failed";
    return;
  }

  saved = src.value;
  markDirty();
  const failed = data.failed || [];
  $("note").textContent =
    `applied ${data.applied} change(s)` +
    (failed.length ? `, ${failed.length} failed` : "") +
    ` · backups ${data.backups}`;
  if (failed.length) {
    renderFindings(failed.map((f) => ({level: "error", where: `${f.tool} ${f.kind} ${f.id}`, message: f.error})));
    findingsEl.hidden = false;
  }
  await refresh();                            // the plan after the fact is the receipt
});

$("reload").addEventListener("click", async () => {
  if (src.value !== saved && !confirm("Discard unsaved edits and re-read the file?")) return;
  const {data} = await api("/api/config");
  src.value = data.text;
  saved = data.text;
  syncGutter(); markDirty(); $("note").textContent = ""; refresh();
});

for (const id of ["verbose", "shownoop"]) $(id).addEventListener("change", refresh);

/* ---- boot ------------------------------------------------------------- */

(async () => {
  const {data} = await api("/api/config");
  src.value = data.text;
  saved = data.text;
  $("path").textContent = data.path + (data.exists ? "" : "  (new file)");
  allTools = data.tools;
  picked = new Set(data.opts.tools);
  $("verbose").checked = data.opts.verbose;
  $("shownoop").checked = data.opts["show-noop"];

  $("tools").innerHTML = allTools
    .map((t) => `<button type="button" data-tool="${t}" aria-pressed="${picked.has(t)}">${t}</button>`)
    .join("");
  $("tools").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const t = b.dataset.tool;
    picked.has(t) ? picked.delete(t) : picked.add(t);
    b.setAttribute("aria-pressed", picked.has(t));
    refresh();
  });

  setupEl.innerHTML = '<div class="formerr">reading the config...</div>';
  syncGutter(); markDirty(); refresh();
})();
</script>
</body>
</html>
